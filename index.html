<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fb9a8"><meta name="description" content="FocusPlay: calm ADHD-support app">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="FocusPlay"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<title>FocusPlay</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>FocusPlay</h1><p class="sub" id="greet"></p></header>
<main>
<section id="tab-play" class="tab active">
 <button class="big primary" id="surprise" data-tx="surprise"></button>
 <div class="grid" id="gameList"></div>
 <div id="gameArea" class="card hidden"><div class="row"><h2 id="gTitle"></h2><span id="gTimer" class="pill"></span></div><div id="gBody"></div><button class="soft" id="gExit" data-tx="finish"></button></div>
</section>
<section id="tab-want" class="tab">
 <div class="card"><h2 data-tx="wantH"></h2><p class="streak" id="streak"></p>
 <form id="wForm" class="row"><input id="wIn" data-ip="wantPh" maxlength="80" required><button class="primary" data-tx="add"></button></form>
 <ul id="wList"></ul><button class="soft small" id="wClear" data-tx="clearDone"></button></div>
</section>
<section id="tab-day" class="tab">
 <div class="card"><h2 data-tx="routineH"></h2><label><span data-tx="sleepH"></span><input type="number" id="sleep" min="0" max="16" step="0.5"></label><label><span data-tx="essH"></span><input type="number" id="ess" min="0" max="12" step="0.5"></label>
 <div id="days"></div></div>
 <div class="card"><h2 data-tx="meH"></h2><div id="bars"></div><p class="legend"><i class="sl"></i><span data-tx="lSleep"></span> <i class="wk"></i><span data-tx="lWork"></span> <i class="me"></i><span data-tx="lMe"></span> <i class="es"></i><span data-tx="lEss"></span></p></div>
</section>
<section id="tab-rem" class="tab">
 <div class="card"><h2 data-tx="remH"></h2>
 <label class="tg"><input type="checkbox" id="brOn"><span data-tx="brOn"></span></label>
 <label><span data-tx="brMinL"></span><input type="number" id="brMin" min="5" max="180"></label><label><span data-tx="brPri"></span><select id="brPri" class="pri"></select></label>
 <label class="tg"><input type="checkbox" id="wdOn"><span data-tx="wdOn"></span></label>
 <label><span data-tx="wdTime"></span><input type="time" id="wdTime"></label><label><span data-tx="wdPri"></span><select id="wdPri" class="pri"></select></label>
 <label class="tg"><input type="checkbox" id="snd"><span data-tx="snd"></span></label>
 <button class="big" id="perm" data-tx="perm"></button><p class="sub" id="permStat"></p>
 <div class="row"><button class="soft lv-needed" data-test="needed"></button><button class="soft lv-important" data-test="important"></button><button class="soft lv-urgent" data-test="urgent"></button></div><p class="sub" id="nextR"></p></div>
 <div class="card"><h2 data-tx="taskH"></h2>
 <form id="cForm"><input id="cName" data-ip="taskPh" maxlength="60" required class="full">
 <label><span data-tx="type"></span><select id="cMode"><option value="time" data-tx="atTime"></option><option value="every" data-tx="repEvery"></option></select></label>
 <label id="cTimeL"><span data-tx="time"></span><input type="time" id="cTime" value="12:00"></label>
 <label id="cEveryL" class="hidden"><span data-tx="everyMin"></span><input type="number" id="cEvery" min="1" max="720" value="60"></label>
 <label><span data-tx="priority"></span><select id="cPri" class="pri"></select></label><button class="primary big" data-tx="addRem"></button></form>
 <ul id="cList"></ul><p class="legend"><i class="lv-needed"></i><span data-tx="p_needed"></span> <i class="lv-important"></i><span data-tx="p_important"></span> <i class="lv-urgent"></i><span data-tx="p_urgent"></span></p></div>
</section>
<section id="tab-gentle" class="tab">
 <div class="card water"><div class="row"><h2 data-tx="waterH"></h2><span class="pill" id="wCount"></span></div><div class="glasses" id="glasses"></div>
 <div class="row"><button class="soft" id="wMinus" aria-label="−1">−</button><button class="primary big" id="wPlus" data-tx="glass"></button></div><label><span data-tx="goal"></span><input type="number" id="wGoal" min="1" max="20"></label></div>
 <div class="card"><h2 data-tx="nudgesH"></h2><p class="sub" data-tx="nudgesSub"></p><ul id="gList"></ul><button class="soft" id="gNew" data-tx="newNudge"></button></div>
 <div class="card hidden" id="gEdit"><h2 id="gEdT"></h2>
  <input id="gName" data-ip="nudgeName" maxlength="50" class="full">
  <label><span data-tx="mode"></span><select id="gMode"><option value="interval" data-tx="modeInt"></option><option value="times" data-tx="modeTimes"></option></select></label>
  <label id="gEvL"><span data-tx="everyMin"></span><input type="number" id="gEvery" min="1" max="720"></label>
  <div id="gTimesL" class="hidden"><div id="gTimes" class="times"></div><button class="soft small" id="gAddT" type="button" data-tx="addTime"></button></div>
  <label><span data-tx="repeat"></span><select id="gRep"><option value="always" data-tx="always"></option><option value="weekdays" data-tx="weekdays"></option><option value="range" data-tx="range"></option></select></label>
  <div id="gDaysL" class="chips hidden"></div>
  <div id="gRangeL" class="hidden"><label><span data-tx="from"></span><input type="date" id="gFrom"></label><label><span data-tx="to"></span><input type="date" id="gTo"></label></div>
  <label class="tg"><input type="checkbox" id="gAh"><span data-tx="ah"></span></label>
  <div id="gAhL" class="row hidden"><input type="time" id="gAhS"><span data-tx="ahTo"></span><input type="time" id="gAhE"></div>
  <label><span data-tx="popPri"></span><select id="gPri" class="pri"></select></label>
  <div class="row"><button class="soft" id="gDel" data-tx="del"></button><button class="soft" id="gCancel" data-tx="cancel"></button><button class="primary" id="gSave" data-tx="save"></button></div></div>
 <div class="card"><h2 data-tx="paH"></h2><p class="sub" data-ih="paSub"></p>
  <div class="stats"><div><b id="uSess"></b><small data-tx="thisSess"></small></div><div><b id="uDay"></b><small data-tx="todayApp"></small></div></div>
  <label class="tg"><input type="checkbox" id="uOn"><span data-tx="nudgeAfter"></span></label><label><span data-tx="limit"></span><input type="number" id="uLim" min="1" max="600"></label></div>
 <div class="card"><h2 data-tx="pfH"></h2><p class="sub" data-tx="pfSub"></p>
  <div class="row presets"><button class="soft" data-pf="10"></button><button class="soft" data-pf="25"></button><button class="soft" data-pf="45"></button></div></div>
</section>
<section id="tab-more" class="tab">
 <div class="card"><h2 data-tx="langH"></h2><select id="lang" class="full" aria-label="Language"></select></div>
 <div class="card"><h2 data-tx="themeH"></h2><div class="pal" id="pal"></div><label><span data-tx="accent"></span><input type="color" id="accent"></label><button class="soft small" id="accReset" data-tx="accReset"></button></div>
 <div class="card"><h2 data-tx="sugH"></h2><form id="sForm"><textarea id="sText" rows="4" maxlength="1000" data-ip="sugPh" required></textarea>
 <label><span data-tx="type"></span><select id="sType"><option value="Upgrade" data-tx="stUp"></option><option value="Downgrade" data-tx="stDown"></option><option value="Improvement" data-tx="stImp"></option><option value="Bug" data-tx="stBug"></option></select></label>
 <div class="row"><span data-tx="rating"></span><div id="stars" class="stars"></div></div>
 <div class="row"><button class="soft" type="submit" data-tx="save"></button><button class="primary" type="button" id="sSend" data-tx="saveSend"></button></div></form>
 <h2 class="mt" data-tx="pastSug"></h2><ul id="sList"></ul></div>
 <div class="card" id="refer"><h2 data-tx="refH"></h2><p id="refP"></p><div class="stats"><div><b id="rCred"></b><small data-tx="credits"></small></div><div><b id="rCnt"></b><small data-tx="friends"></small></div></div>
  <div class="code" id="myCode" dir="ltr"></div><div class="row"><button class="primary" id="rShare" data-tx="share"></button><button class="soft" id="rCopy" data-tx="copy"></button></div>
  <h3 data-tx="enterCode"></h3><div id="rFriend"><form id="rForm" class="row"><input id="rIn" placeholder="FOCUS-XXXX-XXXX" maxlength="15" autocapitalize="characters" dir="ltr"><button class="primary" data-tx="apply"></button></form></div><p class="sub" id="rMsg"></p>
  <p class="legend" data-tx="refNote"></p></div>
 <div class="card" id="privacy"><h2 data-tx="privH"></h2><ul class="priv"><li data-tx="pv1"></li><li data-tx="pv2"></li><li data-tx="pv3"></li><li data-tx="pv4"></li><li data-tx="pv5"></li><li data-tx="pv6"></li></ul><p class="sub"><a href="privacy-policy.html" target="_blank" rel="noopener" data-tx="ppLink"></a> · <a href="terms.html" target="_blank" rel="noopener" data-tx="tosLink"></a></p>
  <div class="row"><button class="primary" id="exp" data-tx="export"></button><button class="soft" id="impB" data-tx="import"></button></div><input type="file" id="imp" accept="application/json,.json" class="hidden"><p class="sub" id="bkMsg"></p></div>
</section>
</main>
<div id="toast" class="hidden lv-needed" role="status" aria-live="polite"><p id="toastMsg"></p></div>
<div id="card" class="hidden"><div class="cardpop lv-important" role="dialog"><b class="badge" data-tx="badgeImp"></b><h2 id="cardT"></h2><p id="cardM"></p><button class="big" id="cardOk" data-tx="gotIt"></button></div></div>
<div id="pfree" class="hidden"><p data-tx="pfTitle"></p><div class="big-t" id="pfT" dir="ltr"></div><p data-ih="pfMsg"></p><button class="big ghost" id="pfStop" data-tx="endEarly"></button></div>
<div id="confirm" class="hidden"><div class="cardpop lv-important" role="dialog"><h2 data-tx="replaceQ"></h2><p id="cfMsg"></p><div class="row"><button class="soft" id="cfNo" data-tx="cancel"></button><button class="primary" id="cfYes" data-tx="replace"></button></div></div></div>
<div id="urgent" class="hidden" role="alertdialog"><b class="badge" data-tx="badgeUrg"></b><h1 id="urgT"></h1><p id="urgM"></p><button class="big" id="urgDone" data-tx="doneBtn"></button><button class="big ghost" id="urgSnooze" data-tx="snooze"></button></div>
<nav><button data-t="play" class="on">🎲<span data-tx="tPlay"></span></button><button data-t="want">✅<span data-tx="tWant"></span></button><button data-t="day">🌤<span data-tx="tDay"></span></button><button data-t="rem">🔔<span data-tx="tRem"></span></button><button data-t="gentle">🌱<span data-tx="tGentle"></span></button><button data-t="more">⚙️<span data-tx="tMore"></span></button></nav>
<script src="i18n.js"></script><script src="app.js"></script></body></html>
